# Replaces the nginx image's /etc/nginx/conf.d/default.conf. Serves the static build on 8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # CSP, nosniff and Referrer-Policy, generated from security-headers.ts in the Docker build.
    #
    # Keep every add_header in that file, at this server level. A location that has ANY add_header
    # of its own inherits none of these, so it would serve without the CSP. The pdf.js worker
    # enforces the CSP from its own response, so the .mjs location must inherit it too.
    include /etc/nginx/snippets/security-headers.conf;

    # nginx's mime.types has no .mjs entry; a module worker served as application/octet-stream
    # fails to load. default_type only applies to extensions mime.types doesn't know.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
